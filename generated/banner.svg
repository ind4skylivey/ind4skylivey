<svg width="1280" height="260" viewBox="0 0 1280 260" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070710" />
      <stop offset="100%" stop-color="#141422" />
    </linearGradient>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .name { font-size: 46px; font-weight: 800; fill: #e2e2ff; }
      .role { font-size: 18px; font-weight: 600; fill: #76e4ff; }
      .stat-label { font-size: 16px; font-weight: 600; fill: #5af0a3; }
      .stat-value { font-size: 22px; font-weight: 700; fill: #c57aff; }
      .footer { font-size: 14px; fill: #5e5e7a; }
      .line { stroke: #ffffff22; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1280" height="260" rx="18" fill="url(#bg)" />

  <g transform="translate(55, 65)">
    <text id="gh-name" class="name">Беле Нуар Флеминг</text>
    <text y="30" class="role">Security Engineer · Network &amp; CLI Systems Builder</text>
    <line x1="0" y1="46" x2="610" y2="46" class="line" />
  </g>

  <g transform="translate(55, 130)">
    <text class="stat-label">★ Stars</text>
    <text x="140" class="stat-value">224</text>

    <text class="stat-label" x="280"> Repos</text>
    <text x="410" class="stat-value">31</text>

    <text class="stat-label" x="540">⑂ Forks</text>
    <text x="670" class="stat-value">26</text>

    <text class="stat-label" x="820">&lt;/&gt; Top 3</text>
    <text x="970" class="stat-value">
      <tspan id="lang1">Shell</tspan>
      <tspan> · </tspan>
      <tspan id="lang2">Rust</tspan>
      <tspan> · </tspan>
      <tspan id="lang3">Other</tspan>
    </text>
  </g>

  <g transform="translate(55, 190)">
    <text class="footer">source of truth: github api → banner regenerated by ci</text>
  </g>
</svg>
